<ion-header>
  <ion-toolbar>
    <ion-title>Search Movies</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="search-bar-container">
    <ion-searchbar
      [(ngModel)]="searchQuery"
      placeholder="Search for a movie..."
      (ionInput)="filterResults()"
      debounce="300">
    </ion-searchbar>
    <ion-button expand="block" (click)="searchMovies()">Search</ion-button>
  </div>

  <p class="result-count" *ngIf="filteredResults.length > 0">
    {{ filteredResults.length }} results
  </p>

  <ion-grid *ngIf="filteredResults.length > 0">
    <ion-row>
      <ion-col size="6" *ngFor="let movie of filteredResults">
        <div class="movie-card" (click)="openDetail(movie)">
          <img [src]="movie.Poster || 'assets/no-poster.png'" alt="poster" />
          <p class="movie-title">{{ movie.Title }}</p>
          <p class="movie-year">{{ movie.Year }}</p>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="empty-state" *ngIf="searched && filteredResults.length === 0">
    <ion-icon name="film-outline" size="large"></ion-icon>
    <p>No results found.</p>
  </div>
</ion-content>
